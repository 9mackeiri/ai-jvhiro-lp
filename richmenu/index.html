<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リッチメニュー 2500x1686</title>
<style>
  /* フォントは pdf/fonts/ の Noto Sans JP を共用（無ければ Hiragino Sans にフォールバック） */
  @font-face { font-family: "Noto Sans JP"; src: url("../pdf/fonts/NotoSansJP-Regular.woff") format("woff"); font-weight: 400; }
  @font-face { font-family: "Noto Sans JP"; src: url("../pdf/fonts/NotoSansJP-Bold.woff") format("woff"); font-weight: 700; }

  :root {
    --heading: #0f172a;
    --text-sub: #6b7280;
    --accent: #0284c7;   /* 吹き出しアイコン（LPの差し色） */
    --divider: #d9d9d9;  /* 薄い灰色の区切り線 */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body {
    width: 2500px; height: 1686px; overflow: hidden;
    font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    color: var(--heading);
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 2×2（各 1250×843 ＝ LINE の「2×2」テンプレートと同じ分割）===== */
  .grid { position: relative; display: grid; grid-template-columns: 1250px 1250px; grid-template-rows: 843px 843px; }
  .cell {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; background: #fff;
  }
  /* 区切り線（2px・薄灰色）。タップ領域の境界（x=1250, y=843）をまたぐ位置に重ねる */
  .grid::before, .grid::after { content: ""; position: absolute; z-index: 1; background: var(--divider); pointer-events: none; }
  .grid::before { left: 1249px; top: 0; width: 2px; height: 1686px; }
  .grid::after  { top: 842px; left: 0; height: 2px; width: 2500px; }

  /* ロゴ置き場：高さ 400px（セル高 843 の約 47%）。画像は比率を保って収める */
  .logo {
    height: 400px; width: 900px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 44px;
  }
  .logo img { max-height: 100%; max-width: 100%; }
  .logo img.note { max-height: 260px; }        /* note は横長ワードマークなので高さを抑える */
  .logo svg { height: 380px; width: 380px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .label { font-size: 96px; font-weight: 700; line-height: 1.2; letter-spacing: .02em; }
  .sub { margin-top: 18px; font-size: 46px; font-weight: 400; color: var(--text-sub); letter-spacing: .04em; }
</style>
</head>
<body>

<div class="grid">

  <!-- 1 左上: Instagram（公式グラデーショングリフ・Meta Brand Resource Center） -->
  <div class="cell">
    <div class="logo"><img src="logos/Instagram_Glyph_Gradient.png" alt="Instagram"></div>
    <div class="label">Instagram</div>
  </div>

  <!-- 2 右上: TikTok（公式アイコン・TikTok for Developers Logo Pack） -->
  <div class="cell">
    <div class="logo"><img src="logos/TikTok_Icon_Black_Circle.png" alt="TikTok"></div>
    <div class="label">TikTok</div>
    <div class="sub">準備中</div>
  </div>

  <!-- 3 左下: note（公式ワードマーク・note Visual Identity） -->
  <div class="cell">
    <div class="logo"><img class="note" src="logos/note_logo.svg" alt="note"></div>
    <div class="label">note</div>
    <div class="sub">準備中</div>
  </div>

  <!-- 4 右下: 質問する（吹き出しの線画・青） -->
  <div class="cell">
    <div class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H8l-4.5 3V12a8 8 0 0 1 8-8h1.5a8 8 0 0 1 8 8z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg>
    </div>
    <div class="label">質問する</div>
    <div class="sub">そのまま送ってOK</div>
  </div>

</div>

</body>
</html>
