<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リッチメニュー 2500x1686</title>
<style>
  /* フォントは pdf/fonts/ の Noto Sans JP を共用（無ければ Hiragino Sans にフォールバック） */
  @font-face { font-family: "Noto Sans JP"; src: url("../pdf/fonts/NotoSansJP-Regular.woff") format("woff"); font-weight: 400; }
  @font-face { font-family: "Noto Sans JP"; src: url("../pdf/fonts/NotoSansJP-Bold.woff") format("woff"); font-weight: 700; }

  /* ===== 配色（LPと同じ） ===== */
  :root {
    --text: #1f2937;
    --text-sub: #4b5563;
    --heading: #0f172a;
    --accent: #0284c7;
    --accent-soft: #e0f2fe;
    --bg: #ffffff;
    --line: #cfe3f1;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    width: 2500px; height: 1686px; overflow: hidden;
    font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    color: var(--heading);
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 左上のアイコン＋名乗り（左上セルの隅に小さく） ===== */
  .who {
    position: absolute; left: 40px; top: 36px;
    display: flex; align-items: center; gap: 22px;
    padding: 10px 34px 10px 10px; border-radius: 999px;
    background: var(--accent-soft);
  }
  .who img {
    width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
    border: 5px solid #fff;
  }
  .who .name { font-size: 40px; font-weight: 700; color: var(--heading); letter-spacing: .02em; }

  /* ===== 2×2 ボタン（各 1250×843 ＝ LINEの「2×2」テンプレートと同じ分割） ===== */
  .grid {
    display: grid; grid-template-columns: 1250px 1250px; grid-template-rows: 843px 843px;
  }
  .btn {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; background: #fff;
    border-right: 6px solid var(--line); border-bottom: 6px solid var(--line);
  }
  .btn:nth-child(2n) { border-right: 0; }
  .btn:nth-child(n+3) { border-bottom: 0; }

  .icon {
    width: 230px; height: 230px; border-radius: 50%;
    background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 44px;
  }
  .icon svg { width: 130px; height: 130px; fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .label { font-size: 108px; font-weight: 700; line-height: 1.2; letter-spacing: .02em; }
  .sub { margin-top: 26px; font-size: 52px; font-weight: 400; color: var(--text-sub); letter-spacing: .04em; }
  .sub b { font-weight: 700; color: var(--accent); }
  .num {
    position: absolute; right: 44px; top: 40px;
    width: 76px; height: 76px; border-radius: 50%;
    background: var(--accent); color: #fff;
    font-size: 44px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

<div class="grid">

  <!-- 1: 無料PDF（左上にアイコン＋名乗り） -->
  <div class="btn">
    <div class="who">
      <img src="../assets/icon-480.jpg" alt="">
      <div class="name">50代からのAI相棒｜ひろき</div>
    </div>
    <span class="num">1</span>
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8M8 9h2"/></svg>
    </div>
    <div class="label">無料PDF</div>
    <div class="sub">最初にやる5つ</div>
  </div>

  <!-- 2: ジャービスの動画 -->
  <div class="btn">
    <span class="num">2</span>
    <div class="icon">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M10 8.5v7l5.5-3.5z"/></svg>
    </div>
    <div class="label">ジャービスの動画</div>
    <div class="sub">Instagram</div>
  </div>

  <!-- 3: どうやって作った？ -->
  <div class="btn">
    <span class="num">3</span>
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6.5 6.5 0 0 0-4 11.6c.7.6 1 1.4 1 2.4h6c0-1 .3-1.8 1-2.4A6.5 6.5 0 0 0 12 3z"/></svg>
    </div>
    <div class="label">どうやって作った？</div>
    <div class="sub">くわしくはこちら</div>
  </div>

  <!-- 4: 質問する -->
  <div class="btn">
    <span class="num">4</span>
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H8l-4.5 3V12a8 8 0 0 1 8-8h1.5a8 8 0 0 1 8 8z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg>
    </div>
    <div class="label">質問する</div>
    <div class="sub">そのまま送って<b>OK</b></div>
  </div>

</div>

</body>
</html>
